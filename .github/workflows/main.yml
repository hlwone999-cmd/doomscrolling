# Tidemark CI: Python checks, JVM unit tests, debug APK (artifact), and an
# optional emulator run for instrumented tests (manual only).
#
# Toolchain, matched to the project (android/gradle/libs.versions.toml):
#   Android Gradle Plugin 8.7.x  -> needs JDK 17 and Gradle >= 8.9
#   compileSdk / targetSdk 35    -> SDK platform android-35
#   AGP 8.7 default build tools  -> build-tools 34.0.0
# The project has no Gradle wrapper jar yet, so Gradle 8.9 is installed by
# gradle/actions/setup-gradle and called as `gradle`.

name: Tidemark build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      instrumented:
        description: "Also run instrumented tests on an emulator (slow)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python checks (no Android needed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine simulation and fuzz
        run: python replica/tests/engine_sim.py
      - name: Goal, stats, CSV and policy logic
        run: python replica/tests/logic_sim.py
      - name: Data layer SQL in SQLite
        run: python replica/tests/check_data_layer.py
      - name: Static project checks (resources, strings, imports, offline rules)
        run: python replica/tests/check_project.py

  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-24.04
    needs: checks
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: Check toolchain matches the project
        run: |
          agp=$(sed -n 's/^agp *= *"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)
          wrapper=$(sed -n 's/.*gradle-\([0-9.]*\)-bin.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)
          echo "AGP=$agp, gradle-wrapper.properties=$wrapper, CI Gradle=8.9, JDK=17"
          case "$agp" in
            8.7.*) ;;
            *) echo "::error::AGP $agp is not 8.7.x. Re-check the JDK/Gradle versions in this workflow (AGP 8.7 needs JDK 17 and Gradle >= 8.9)."; exit 1 ;;
          esac
          if [ "$wrapper" != "8.9" ]; then
            echo "::error::gradle-wrapper.properties says $wrapper but CI installs 8.9. Keep them in step."; exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu runners ship the Android SDK (ANDROID_HOME) with its command-line tools
      # and accepted licences; install exactly what this project compiles against.
      - name: Set up Android SDK (platform 35, build-tools 34.0.0)
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"; exit 1
          fi
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-35" "build-tools;34.0.0" "platform-tools" > sdk-install.log 2>&1 || {
            echo "::error title=SDK install failed::$(tail -n 20 sdk-install.log | awk 'BEGIN{ORS="%0A"}{gsub(/%/,"%25");print}')"; exit 1; }
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # On failure, the Kotlin/Gradle error lines are also written as an annotation,
      # so they can be read without opening the full log.
      - name: JVM unit tests
        run: |
          set -o pipefail
          if ! gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee unit.log; then
            errs=$(grep -E "^e: |error:|What went wrong|FAILED|Caused by|> " unit.log | grep -v "^> Task" | head -n 60 | awk 'BEGIN{ORS="%0A"}{gsub(/%/,"%25");print}')
            echo "::error title=JVM unit tests failed (or the project did not compile)::$errs"
            exit 1
          fi

      - name: Unit test summary (per class, public annotation)
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          rows, tot = [], [0, 0, 0, 0]
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              r = ET.parse(f).getroot()
              t, fa, er, sk = (int(r.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              rows.append("%s: %d tests, %d failed, %d errors, %d skipped" % (r.get("name").split(".")[-1], t, fa, er, sk))
              tot = [a + b for a, b in zip(tot, (t, fa, er, sk))]
          head = "JVM unit tests: %d run, %d failed, %d errors, %d skipped" % tuple(tot)
          print(head)
          for row in rows:
              print(row)
          print("::notice title=" + head + "::" + "%0A".join(rows))
          EOF

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug --stacktrace 2>&1 | tee assemble.log; then
            errs=$(grep -E "^e: |error:|What went wrong|FAILED|Caused by|> " assemble.log | grep -v "^> Task" | head -n 60 | awk 'BEGIN{ORS="%0A"}{gsub(/%/,"%25");print}')
            echo "::error title=assembleDebug failed::$errs"
            exit 1
          fi

      - name: Find the APK
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No APK found in android/app/build/outputs/apk/debug/ after assembleDebug."
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          ls -l "$apk"

      - name: APK must not request INTERNET
        run: |
          aapt2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          perms=$("$aapt2" dump permissions "${{ steps.apk.outputs.path }}")
          echo "$perms"
          if echo "$perms" | grep -q "android.permission.INTERNET"; then
            echo "::error::The APK requests android.permission.INTERNET. Tidemark must stay offline; find the dependency that adds it."
            exit 1
          fi

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tidemark-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  instrumented:
    name: Instrumented tests (emulator, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.instrumented
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-reports
          path: android/app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore
