<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: #888c94; font-family: Inter, system-ui, Roboto, sans-serif; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .phone { width: 380px; background: var(--color-bg); color: var(--color-text); border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .cap { font: 600 12px/16px Inter, sans-serif; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .4px; }
  .num { font-variant-numeric: tabular-nums; }

  .btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .primary { background: var(--color-accent); color: var(--color-on-accent); }
  .secondary { background: transparent; color: var(--color-text); border: 1px solid var(--color-border-input); }
  .ghost { background: transparent; color: var(--color-accent); }
  .danger { background: var(--color-danger); color: var(--color-on-danger); }
  .btn[disabled] { opacity: .38; cursor: default; }

  .ring { width: 140px; height: 140px; position: relative; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .big { font: 800 40px/44px Inter, sans-serif; }
  .muted { color: var(--color-text-muted); font-size: 14px; line-height: 20px; }
  .lvl { font: 600 12px/16px Inter, sans-serif; display: inline-flex; align-items: center; gap: 6px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { font: 700 28px/36px Inter, sans-serif; }
  .delta { font: 600 12px/16px Inter, sans-serif; }
  .seg { display: flex; background: var(--color-surface-2); border-radius: 999px; padding: 4px; }

<div class="row" id="root"></div>
<template id="phone">
  <div class="phone">
    <div class="cap" data-label></div>

    <div class="card hero">
      <div class="ring">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="60" stroke="var(--color-surface-2)" stroke-width="12" fill="none"/>
          <circle cx="70" cy="70" r="60" stroke="var(--color-sev-mid)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="377" stroke-dasharray="377" stroke-dashoffset="136"/>
        </svg>
        <div class="in"><div class="big num">128</div><div class="muted">of 200</div></div>
      </div>
      <div>
        <div class="muted">Short videos today</div>
        <div class="lvl" style="color:var(--color-sev-mid);margin:6px 0"><span class="dot" style="background:var(--color-sev-mid)"></span>Rising · 64%</div>
        <div class="muted num">38 min · 5 sessions</div>
      </div>
    </div>

    <div class="grid2">
      <div class="card"><div class="muted">Avg per day</div><div class="stat num">96</div><div class="delta" style="color:var(--color-sev-low)">▼ 18% vs last week</div></div>
      <div class="card"><div class="muted">This week</div><div class="stat num">672</div><div class="delta" style="color:var(--color-sev-high)">▲ 12% vs last week</div></div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="seg"><span>Day</span><span class="on">Week</span><span>Month</span></div>
      <div class="bars">
        <div class="goal-line" style="bottom:72%"></div>
        <div style="height:55%"></div><div style="height:80%"></div><div style="height:40%"></div><div style="height:95%"></div><div style="height:62%"></div><div style="height:30%"></div><div style="height:64%"></div>
      </div>
      <div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    </div>

    <div class="video" aria-label="Sample video behind the counter">
      <div class="pill"><span class="dot" style="background:var(--overlay-sev-low)"></span><span class="num">12</span></div>
      <div class="pill b"><span class="dot" style="background:var(--overlay-sev-mid)"></span><span class="num">164</span><small class="num">· 21:07</small></div>
      <div class="pill c"><span class="dot" style="background:var(--overlay-sev-over)"></span><span class="num">200!</span></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><b>All apps · videos</b><span class="muted num">128 / 200</span></div>
      <div class="track" style="margin:10px 0"><i style="width:64%;background:var(--color-sev-mid)"></i></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip">Every day</span><span class="chip">Blocks at goal</span><span class="chip">−10% weekly → 30</span></div>
    </div>

    <div class="card">
      <div class="prow"><svg class="i" viewBox="0 0 24 24" style="color:var(--color-warning)"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div class="t"><b>Accessibility service</b><span class="muted">Needed to count videos</span></div><button class="btn primary">Turn on</button></div>
      <div class="prow"><svg class="i" viewBox="0 0 24 24" style="color:var(--color-success)"><path d="M20 6 9 17l-5-5"/></svg><div class="t"><b>Notifications</b><span class="muted">Reminders and goals</span></div><span class="muted">On</span></div>
    </div>

    <div class="banner"><svg class="i" viewBox="0 0 24 24" style="color:var(--color-danger)"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><div class="t">Counting stopped. Android turned the service off.</div><button class="btn ghost">Fix</button></div>

    <div class="btns">
      <button class="btn primary">Agree and continue</button>
      <button class="btn secondary">Not now</button>
      <button class="btn ghost">Details</button>
      <button class="btn danger">Delete all</button>
      <button class="btn primary" disabled>Disabled</button>
    </div>

    <div class="nav">
      <span class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Today</span>
      <span><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Stats</span>
      <span><span class="ic"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span>Goals</span>
      <span><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></span>Settings</span>
    </div>
  </div>
</template>
<script>
  const root = document.getElementById('root');
  const tpl = document.getElementById('phone');
  for (const theme of ['light', 'dark']) {
    const node = tpl.content.firstElementChild.cloneNode(true);
    node.setAttribute('data-theme', theme);
    node.querySelector('[data-label]').textContent = theme + ' theme';
    root.appendChild(node);
  }
</script>
